# 异字形重码字（用异字形编码，规避重码，不用选字）：
  # 渝eomv，熬gkf，处heo，扁hsbt，勺pm，亮yrbu，

# 常用重码字（加x不选字）（格式：【原字】重码字）：
# 原为一码：2字
  # 【日】曰xa，【大】乂xk，
# 原为二码：40字
  # 【且】肛xbm，【冊】皿xbt，【本】杠xdm，【双】汉xee，【戏】叉xei，
  # 【灶】尘xfg，【床】术xid，【犬】义xik，【戒】弁xit，【未】宋xjd，
  # 【有】冇xkb，【东】杀xkd，【九】夷xkn，【不】灭xmf，【夕】弘xni，
  # 【久】欠xno，【內】内xob，【仕】隹xog，【什】午xoj，【仲】个xol，
  # 【丘】仝xom，【乞】亿xon，【化】仑xop，【旬】旨xpa，【勾】勺xpi，
  # 【忆】乜xpn，【找】扩xqi，【击】扎xqu，【只】叭xrc，【叱】吣xrp，
  # 【己】已xsu，【区】尹xsk，【共】业xtc，【关】艾xtk，【艺】芎xtn，
  # 【羊】芈xtq，【日】并xtt，【曲】苗xtw，【果】困xwd，【文】头xyk，


#
# 常用符号：
# 天气'/tq'，几何'/jh'，数字+圈'/szq'，字母+圈'/zmq'，漢字+圈'/hzq'，

#数字后的", ."号默认为英文字符，按两次可以自動输出为中文字符

patch:

#允許在光標位置獲取失敗時於窗口左上角繪製候選框（而不是桌面左上角）  
  style/layout/enhanced_position: true
#字频调整
  translator/enable_user_dict: false
#碼表輸入法連打
  translator/enable_sentence: true
#關閉倉頡與拼音混打
  abc_segmentor/extra_tags: {}
#顶字上屏
  speller/auto_select: false
  
#調整字根展示方式
  translator/preedit_format: 
#顶部输出码。字母在前，提示顯示爲字根
    - xlit|日月金木水火土竹戈十大中一弓人心手口尸廿山女田難卜符~|abcdefghijklmnopqrstuvwxyz~|
  translator/comment_format:
#预选字后面的输出码。字母在前，提示顯示爲字根
    - xlit|日月金木水火土竹戈十大中一弓人心手口尸廿山女田難卜符~|abcdefghijklmnopqrstuvwxyz~|

#配置输入当前日期/时间，需要搭配rime.lua文件    
  "engine/translators/@next": lua_translator@date_translator

#反查
  #引入拆字的方案
  schema/dependencies: {}
  
#輸入Symbols修正，修正後按「/」才能調出符號
  "recognizer/patterns/punct": "^/([a-z]+|[0-9])$"

#加入常用符號
  punctuator/symbols:
#常用符號/物理
    '/wuli': [ °, °C, Ω, Φ, m², cm², km², m³]
#常用符號/數學
    '/uuxt': [ ±, ×, ÷, ≤, ≥, ≠, ≈, ∞, ✓, x]
#常用符號/三角形
    '/sjjn': [ ◄, ►, ▲, ▼]
#常用符號/箭頭
    '/jmtz': [ ↑, ↓, ←, →, ↕, ↔, ↖, ↗, ↙, ↘]
#常用符號/商標
    '/uhbn': [ ®, ™]
#常用符號/逻辑学
    '/loji': [ ¬, ∧, ∨, →, ↔, ⊥, ｜, ↓, ├, ╞, ∴, ∵, ⊃, ⇒, ⇔, ⊕, ⊻, ∀, ∃, ≡]
#常用符號/集合
    '/jihe': [ ∈, ∉, ⊆, ⊇, ⊂, ⊃, ∪, ∩, П, φ]
          

#標點符號顶字上屏（句号逗号默认为翻页，单独设置覆盖掉）
#可以顶字上屏的标点：逗号，句号，冒号，双引号，单引号，感叹号，问号
  key_binder/bindings:
    - { when: has_menu, accept: comma, send: comma } #逗号
    - { when: has_menu, accept: period, send: period } #句号
  key_binder/bindings/+:
    - { accept: "Shift+space", send: "Shift+space", when: always } #解绑Shift+space，而且也能让Shift+space时输出空格选字上屏
  
#中文, 半角, 中文標點, 繁體漢字, 通用字集
  switches:
    - name: ascii_mode
      reset: 0
      states: ["中文", "西文"]
    - name: full_shape
      reset: 0
      states: ["半角", "全角"]
    - name: ascii_punct
      reset: 0
      states: ["，。", "，．"]
    - name: simplification
      reset: 0
      states: ["漢字", "汉字"]
    - name: extended_charset
      reset: 1
      states: ["通用", "增廣"]
