# 基于默认的同文风主题，制作本补丁
patch:
  config_version: "3.3.10"
  name: aniu定制       #方案名称
  author: "aniu <goodaniu@163.com>"
      
  #锚点
  anchor: 
    - &kbgp .2.jpg    #背景图片
    # - &kbgp 0x88e8853b    #背景颜色
  
  # 风格设定
  style/+:
    __patch:
      candidate_font:  #候选栏字体，大字库
        - "TH-Khaai-TP2.ttf"
        - "TH-Khaai-TP0.ttf"
        - "TH-Khaai-TP16.ttf"
      horizontal_gap: 1
      vertical_gap: 1
      round_corner: 4
      keyboard_height: 265         #pad 400
      keyboard_height_land: 160    #pad 320
      keyboard_padding_land: 200  #pad 250
      # keyboard_padding_bottom: 30
      candidate_view_height: 30  
      # key_text_size: 32              #pad 32
      comment_position: top #编码提示布局位置：right / top / overlay
      # comment_text_size: 8
      enter_labels/default: ⏎

      
  # 工具栏
  "tool_bar/button_spacing": 1        #pad 50
  "tool_bar/+":
    hide_button: &hide_button
      foreground:
        style: "ic@keyboard_close"
        fg_normal: candidate_text_color
      action: Hide
  
    emoji_button: &emoji_button
      foreground:
        style: "ic@emoticon"
      # 前景样式可以为空，使用默认样式，按钮将显示为 action 的 label
      action: liquid_keyboard_emoji
      long_press_action: liquid_keyboard_math
  
    clipboard_button: &clipboard_button
      foreground:
        style: "ic@clipboard"
      action: clipboard_window
  
    edit_button: &edit_button
      foreground:
        style: "ic@cursor_text"
      action: Keyboard_editor
  
    ascii_mode_button: &ascii_mode_button
      foreground:
        option_styles: ["中", "En"] # 样式也可以为表，将根据 action 的 toggle 决定
        font_size: 18  # 按钮字体大小
        padding: 8
      action: Mode_switch
  
    full_shape_button: &full_shape_button
      foreground:
        option_styles: ["ic@moon_full", "ic@moon_new"]
      action: Zenkaku_Hankaku
    unit_button: &unit_button
      foreground:
        style: "ic@weight-kilogram"
        font_size: 20
      action: liquid_keyboard_unit
    chaxun_button: &chaxun_button
      foreground:
        style: "☟"
        font_size: 23
      action: "`"
      long_press_action: "/"
    punct_button: &punct_button
      foreground:
        option_styles: ["，。", ",."]
      action: Punct_switch
    scheme_button: &scheme_button
      foreground:
        style: "☣"
        font_size: 20
      action: Schema_switchcn
  # 右侧按钮列表（从右向左排列）
      long_press_action: "Menu"
    buttons: 
      - *hide_button
      - *chaxun_button
      - *emoji_button
      - *clipboard_button
      - *edit_button
      - *scheme_button
      # - *ascii_mode_button
      - *punct_button
      


  
# 液态键盘
  liquid_keyboard/fixed_key_bar/position: right
  liquid_keyboard/single_width: 45    #single类型的按键宽度
  # liquid_keyboard/vertical_gap: 8     #纵向按键间隙
  liquid_keyboard/margin_x: 2       #左右按键间隙的1/2

  liquid_keyboard/keyboards: [emoji, math, ascii, cn, unit, symbol, symbollist, list, jiaobiao, caiwu, history, markdown, zhibiao, ids, tabs, pinyin, script_symbols, jp, grease, rusa, korea, lation, yinbiao, yanwenzi, combing, emoji_full]  #tab列表
  liquid_keyboard/unit/keys: "℃¥$€฿￡㎡㎥°℉￥£￠₠¹²³⁴⁵ⁿ⁶⁷⁸⁹⁰ˣ⁺⁻⁼⁽⁾½⅓¼⅔¾₁₂₃₄₅ₙ₆₇₈₉₀ₓ₊₋₌₍₎℅㎏㎎㎍㏂㏘"
  liquid_keyboard/math/keys: "≈＝≠≌<>≤≥≡()[]{}-+±×*/÷√²³iπen&%‰‱°′″∫∬∭∮∯∰∞∑∏∵∴⊥∝∪∨•〒∽∈∩∧⊙⌒∥∟∣∂∆∉⊕⊿∠"
  liquid_keyboard/symbol/keys: "△▽○◇□☆▲▼●◆■★▷◁▶◀♻♲†⚝✡⚹✦✸✹￼�×☑☒✅❎✔✘✓✗⌫☀☼☽☾◑◐㏂㏘☭♀♂☹☻☠☜☝☞☚☟☛▪•‥…∷※♩♪♫♬§°♭♯♮‖¶№◎¤۞℗®©卍卐℡™㏇Φ↖↑↗⇦⇧⇨←↔→⇩⇳⇪↙↓↘⇄⇅⇆⇤↩⇥◤◥▸◂❏❐◣◢▴▾✂⏍✍㊤㊧㊥㊨㊦◲〼▢▣↶↷ϟ✎✆☱☰☴⚿⛮⚙☲☯☵⛶☩☐☳☷☶💬🗨⟲ღ✈☂🎤🌐🔍❀✣⌘⚯✁📋📝"
  liquid_keyboard/+:
    markdown:
      name: "mark"
      type: SYMBOL
      keys: #骰子
        - 表格: "{表格}" 
        - 代码块: '{代码块}{Up}{Up}'
        - 链接: '{链接}{Left}{Left}{Left}'
        - 标注: '{标注}'
        - 加粗: '****{Left}{Left}'
        - 待办: '{待办}'
        - 删除线: '~~~~{Left}{Left}'
    jiaobiao:
      type: SINGLE
      name: 角标
      keys: "⁰¹²³⁴⁵⁶⁷⁸⁹₀₁₂₃₄₅₆₇₈₉ᵃᵇᶜᵈᵉᶠᵍʰⁱʲᵏˡᵐⁿᵒᵖʳˢᵗᵘᵛʷˣʸᶻᴬᴮᴰᴱᴳᴴᴵᴶᴷᴸᴹᴺᴼᴾᴿᵀᵁᵂⱽ⁺⁻⁼⁽⁾₊₋₌₍₎ₐₔₑₕᵢⱼₖₗₘₙₒₚᵣₛₜᵥₓ᙮ᵩᵦ˪៳៷ᵨ៴ᵤᵪᵧᴀʙᴄᴅᴇғɢʜɪᴊᴋʟᴍɴᴏᴘǫʀsᴛᴜᴠᴡxʏᴢ"
    zhibiao:
      keys: "─━│┃╌╍╎╏┄┅┆┇┈┉┊┋┌┍┎┏┐┑┒┓└┕┖┗┘┙┚┛├┝┞┟┠┡┢┣┤┥┦┧┨┩┪┫┬┭┮┯┰┱┲┳┴┵┶┷┸┹┺┻┼┽┾┿╀╁╂╃╄╅╆╇╈╉╊╋╪╫╬═║╒╓╔╕╖╗╘╙╚╛╜╝╞╟╠╡╢╣╤╥╦╧╨╩╳╔╗╝╚╬═╓╩┠┨┯┷┏┓┗┛┳⊥﹃﹄┌╮╭╯╰"
      name: "制表"
      type: SINGLE
    caiwu:
      type: SINGLE
      name: "财务"
      keys: [萬,億,兆,厘,毫,秒,￥,百分之,克,米,升,吨,星期,工时,工日,美元,英镑,欧元,周,〇,之,第,人民币,号,一,二,三,百,元,年,四,五,六,千,角,月,七,八,九,万,分,日,十,零,点,亿,整,正,壹,贰,叁,佰,元,年,肆,伍,陆,仟,角,月,柒,捌,玖,万,分,日,拾,零,点,亿,整,正]
  
  colors: # 几种颜色
    0: &color0 0xffc03f3c       #胭脂红
    1: &color1 0xff000000      #纯黑
    2: &color2 0xffffffff         #纯白
    3: &color3 0xffe1e3e7      #浅灰
    4: &color4 0xffacb2c2      #中灰，偏蓝调
    5: &color5 0xff131313      #深灰，近黑
    6: &color6 0xff3266a0      #钴蓝
    7: &color7 0x00            #透明
    8: &color8 0xff838383     #中亮灰
    9: &color9 0xff37474f     #冷灰
    10: &color10 0xffe8e8e8  #亮灰
    11: &c1 0xff8FB191 #Shift键颜色，中碧绿
    12: &c2 0xffB06665 #删除键颜色，暗红
    13: &c3 0xffB69889 #数字/主键盘切换，驼色
    14: &c4 0xffD6BC67 #中英键颜色，秋叶金黄
    15: &c5 0xffA1B763 #逗号键颜色，苔藓绿
    16: &c6 0xffB095B5 #句号键颜色，淡雅紫
    17: &c7 0xff006E5F #回车键颜色，翠绿
    18: &h1 0xfff2de76  #候选背景，琥珀色
    # 18: c8 0xffdadee1 #数字行背景，婴儿蓝
    # 19: c9 0xff0041A5 #孔雀蓝，未使用

  
  # 主题颜色
  "preset_color_schemes":
    default:
      name: "彩色定制"
      author: "aniu"
      back_color: 0xffdadee1
      candidate_separator_color: *color0  # 0xffc9cdcf
      candidate_text_color: 0xff5a676e
      comment_text_color: *c7  #0xff7b868c
      dark_scheme: steam
      hilited_back_color: *h1
      hilited_candidate_back_color: *h1
      hilited_candidate_text_color: *color0
      hilited_comment_text_color: *c7
      hilited_key_back_color: *color6
      hilited_key_symbol_color: *color2
      hilited_key_text_color: *color1
      hilited_off_key_back_color: 0xffb1b4bd
      hilited_off_key_text_color: *color1
      hilited_text_color: *color1
      key_back_color: *color2
      key_symbol_color: *color8
      key_text_color: *color9
      keyboard_back_color: 0x88e8853b
      keyboard_background: *kbgp
      label_color: *color6
      off_key_back_color: 0xffc8ccd0
      off_key_text_color: *color8
      popup_back_color: *h1
      popup_text_color: *color0
      text_back_color: *color10
      text_color: *color0
      th1: *color9   # QWERTY
      th2: *color9   # ASDFG
      th3: *color9   # ZXCVB
      th4: *color9   # 主键盘最后一行普通键
      bh1: *color10   # QWERTY
      bh2: *color10   # ASDFG
      bh3: *color10   # ZXCVB
      bh4: *color10   # 主键盘最后一行普通键
      taoe: *color6
      baoe: *color2

      th0: *color9   # 主键盘数字行
      bh0: *color10   # 主键盘数字行
      ksc4: *color9    # 符号文字标签色
      ##  前景色
      tsh: *color9    # Shift
      tbs: *color9    # BackSpace
      tnu: *color9    # 123
      tms: *color9    # Mode_switch
      tkg: *color9    # Space
      tgn: *color9    # 数字键盘符号，暂未用
      tco: *color9    # 逗号
      tpe: *color9    # 句号
      tenter: *color2    # 回车键
      ##  背景色
      bsh: *c1    # Shift
      bbs: *c2    # BackSpace
      bnu: *c3    # 123
      bms: *c4    # Mode_switch
      bkg: *color10    # Space
      bco: *c5    # 逗号
      bpe: *c6    # 句号
      bgn: *color4    # 数字键盘符号
      benter: *c7    # 回车键
      
    steam:
      name: "Steam"
      author: "Patricivs <ipatrickmac@me.com>"
      light_scheme: default
      text_color: 0xff528ccd
      back_color: 0xff171614
      popup_back_color: *c7
      border_color: *color0
      label_color: *color2
      hilited_text_color: 0xffd1cfc9
      hilited_back_color: 0xff171614
      candidate_text_color: *color2
      comment_text_color: 0xffa9a7a7
      hilited_candidate_text_color: *color2
      hilited_comment_text_color: 0xffa9a7a7
      hilited_candidate_back_color: 0xff314259
      
      bh0: *color5
      bh1: *color5   # QWERTY
      bh2: *color5   # ASDFG
      bh3: *color5   # ZXCVB
      bh4: *color5   # 主键盘最后一行普通键
      baoe: *color5
      bsh: *color5    # Shift
      bbs: *color5    # BackSpace
      bnu: *color5    # 123
      bms: *color5    # Mode_switch
      bkg: *color5    # Space
      bco: *color5    # 逗号
      bpe: *color5    # 句号
      bgn: *color5    # 数字键盘符号
      benter: *color5    # 回车键
      
    biaozhun:
      name: "标准配色！"  #方案名称
      author: 风花絮 #作者信息
      dark_scheme: steam
      back_color: *color2 #候选区背景状态栏
      candidate_separator_color: *color2 #候选分割背景
      candidate_text_color: *color1 #候选文本
      comment_text_color: *color3 #提示
      hilited_back_color: *color2 #高亮编码背景
      hilited_candidate_back_color: *color2 #高亮候选背景
      hilited_candidate_text_color: *color6 #高亮候选文本
      hilited_comment_text_color: *color1 #高亮提示
      hilited_key_back_color: *color6 #高亮按键背景
      hilited_key_symbol_color: *color2 #高亮按键符号
      hilited_key_text_color: *color1 #高亮按键文本
      hilited_off_key_back_color: *color2 #高亮按键关闭状态背景
      hilited_off_key_text_color: *color1 #高亮按键关闭状态文本
      hilited_text_color: *color1 #高亮编码
      key_back_color: *color2 #按键背景
      key_symbol_color: *color8 #按键符号
      key_text_color: *color1 #按键文本
      keyboard_back_color: *color3 #键盘背景
      label_color: *color6 #标签
      off_key_back_color: *color4  #按键关闭状态背景
      off_key_text_color: *color8 #按键关闭状态文本
      preview_back_color: *color4 #按键提示背景
      preview_text_color: *color6 #按键提示文本
      text_color: *color6 #编码
      text_back_color: *color2 #编码区背景
      bkg: *color2 #空格键背景色
      tkg: *color1 #空格键文字颜色
      benter: *color6 #回车键背景色
      tenter: *color2 #回车键文字颜色
      bgn: *color4 #功能键背景色
      tgn: *color2 #功能键文字颜色
      bbs: *color4 #退格键背景色
      tbs: *color2 #退格键文字颜色
      baoe: *color2 #aoeiu背景色
      taoe: *color6 #aoeiu文字颜色
      bh1: *color2 #第一行背景色
      th1: *color1 #第一行文字颜色
      bh2: *color2 #第二行背景色
      th2: *color1 #第二行文字颜色
      bh3: *color2 #第三行背景色
      th3: *color1 #第三行文字颜色
      bh4: *color2 #第四行背景色
      th4: *color1 #第四行文字颜色
      
      th0: *color1   # 主键盘数字行
      bh0: *color2   # 主键盘数字行
      ksc4: *color9    # 符号文字标签色
      ##  前景色
      tsh: *color2    # Shift
      tnu: *color2    # 123
      tms: *color2    # Mode_switch
      tkg: *color1    # Space
      tco: *color2    # 逗号
      tpe: *color2    # 句号
      ##  背景色
      bsh: *color4    # Shift
      bnu: *color4    # 123
      bms: *color4    # Mode_switch
      bco: *color4    # 逗号
      bpe: *color4    # 句号
# 默认键盘布局
    
  # "preset_keyboards/melt_eng/import_preset": letter #预设
  preset_keyboards/default:
    author: "aniu"
    name: 26键默认布局
    width: 10
    # height: 48
    ascii_mode: 0
    # reset_ascii_mode: true
    # lock: true
    label_transform: uppercase
    keys: 
    # 数字行
      - {click: 1, popup: [ ¹, ₁ ], swipe_up: '~', label_symbol: '~', key_back_color: bh0, key_text_color: th0}
      - {click: 2, popup: [ ², ₂ ], swipe_up: "@", label_symbol: '@', key_back_color: bh0, key_text_color: th0}
      - {click: 3, popup: [ ³, ₃ ], swipe_up: "#",  label_symbol: '#', key_back_color: bh0, key_text_color: th0}
      - {click: 4, popup: [ ⁴, ₄ ], swipe_up: "$", label_symbol: '$', key_back_color: bh0, key_text_color: th0}
      - {click: 5, popup: [ ⁵, ₅ ], swipe_up: "%", label_symbol: '%', key_back_color: bh0, key_text_color: th0}
      - {click: 6, popup: [ ⁶, ₆ ], swipe_up: "^", label_symbol: '^', key_back_color: bh0, key_text_color: th0}
      - {click: 7, popup: [ ⁷, ₇ ], swipe_up: "&", label_symbol: '&', key_back_color: bh0, key_text_color: th0}
      - {click: 8, popup: [ ⁸, ₈ ], swipe_up: "*", label_symbol: '*', key_back_color: bh0, key_text_color: th0}
      - {click: 9, popup: [ ⁹, ₉ ], swipe_up: '\', label_symbol: '\', key_back_color: bh0, key_text_color: th0}
      - {click: 0, popup: [ ⁰, ₀ ], swipe_up: '{fanxiegang}', label_symbol: '/', key_back_color: bh0, key_text_color: th0}
    # 第一行
      - {click: q, long_click: Q, label_symbol: '=', swipe_up: '=', key_back_color: bh1, key_text_color: th1}
      - {click: w, long_click: W, label_symbol: '+', swipe_up: '+', key_back_color: bh1, key_text_color: th1}
      - {click: e, long_click: E, label_symbol: '-', swipe_up: '-', key_back_color: bh1, key_text_color: th1}
      - {click: r, long_click: R, label_symbol: '×', swipe_up: '×', key_back_color: bh1, key_text_color: th1}
      - {click: t, long_click: T, label_symbol: '÷', swipe_up: '÷', key_back_color: bh1, key_text_color: th1}
      - {click: y, long_click: Y, label_symbol: '…', swipe_up: '……', key_back_color: bh1, key_text_color: th1}
      - {click: u, long_click: U, label_symbol: '`', swipe_up: '{fanyinhao}', hint: "查", swipe_down: "`", key_back_color: bh1, key_text_color: th1}
      - {click: i, long_click: I, label_symbol: '|', swipe_up: "|", hint: '撤', swipe_down: '{undo}', key_back_color: bh1, key_text_color: th1}
      - {click: o, long_click: O, label_symbol: '·', swipe_up: "·", hint: "重", swipe_down: '{redo}', key_back_color: bh1, key_text_color: th1}
      - {click: p, long_click: P, label_symbol: '→', swipe_up: '→', hint: '段', swipe_down: '{duanluo}{Left}{Left}{Left}{Left}', key_back_color: bh1, key_text_color: th1}
      # 第二行
      - {click: 'a', long_click: A, label_symbol: '—', swipe_up: '——', key_back_color: bh2, key_text_color: th2, width: 11.11}
      - {click: 's', long_click: S, label_symbol: '《》', hint: "<>", swipe_up: '<>{Left}',swipe_down: '{khj}{Left}', key_back_color: bh2, key_text_color: th2, width: 11.11}
      - {click: 'd', long_click: D, label_symbol: "【】", hint: '[]', swipe_up: '[]{Left}', swipe_down: '{khz}{Left}', key_back_color: bh2, key_text_color: th2, width: 11.11}
      - {click: 'f', long_click: F, label_symbol: "｛｝", hint: '{}', swipe_up: '｛｝{Left}', swipe_down: '{}{Left}', key_back_color: bh2, key_text_color: th2, width: 11.11}
      - {click: 'g', long_click: G, label_symbol: "（）", hint: '()', swipe_up: '(){Left}', swipe_down: '{khx}{Left}', key_back_color: bh2, key_text_color: th2, width: 11.11}
      - {click: 'h', long_click: H, label_symbol: '“”', swipe_up: '“”{Left}', swipe_down: '{shuangyin}{shuangyin}{Left}', key_back_color: bh2, key_text_color: th2, width: 11.11}
      - {click: 'j', long_click: J, label_symbol: "'",swipe_up: "danyinhao", swipe_down: '‘’{Left}', key_back_color: bh2, key_text_color: th2, width: 11.11}
      - {click: 'k', long_click: K, label_symbol: '"', swipe_up: 'shuangyin', swipe_down: '"', key_back_color: bh2, key_text_color: th2, width: 11.11}
      - {click: 'l', long_click: L, label_symbol: '、', swipe_up: '、', key_back_color: bh2, key_text_color: th2, width: 11.11}
      # 第三行
      - {click: Shift_L, long_click: Shift_L3, double_click: Shift_L2, label: ↑, hilited_key_back_color: benter, key_back_color: bsh, key_text_color: tsh, width: 11.11}
      - {click: z, long_click: Z, label_symbol: '☑', swipe_up: select_all, key_back_color: bh3, key_text_color: th3, width: 11.11}
