      - {click: z, long_click: Z, hint: "ou", label_symbol: '☑', swipe_up: select_all, key_back_color: bh3, key_text_color: th3, width: 11.11}
      - {click: x, long_click: X, hint: "ia  ua", label_symbol: '✂', swipe_up: cut, key_back_color: bh3, key_text_color: th3, width: 11.11}
      - {click: c, long_click: C, hint: "ao", label_symbol: '❐', swipe_up: copy, key_back_color: bh3, key_text_color: th3, width: 11.11}
