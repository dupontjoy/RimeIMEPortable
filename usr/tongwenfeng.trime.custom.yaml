      - {click: b, long_click: B, hint: "in", label_symbol: ':', swipe_up: ":", swipe_down: 'maohao', key_back_color: bh3, key_text_color: th3, width: 11.11}
      - {click: n, long_click: N, hint: "iao", label_symbol: ';', swipe_up: ";", swipe_down: 'fenhao', key_back_color: bh3, key_text_color: th3, width: 11.11}
